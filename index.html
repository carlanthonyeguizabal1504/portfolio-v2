<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Carl Anthony Eguizabal | Student Portfolio</title>
    <meta data-static-meta name="description" content="School projects and the learning journey of Carl Anthony Eguizabal, a second-year BSIT student." />
    <link rel="icon" href="/portfolio-v2/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/portfolio-v2/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The phone bar's mark is the mobile LCP; dark is the default theme, so its mark loads first. -->
    <link rel="preload" href="/portfolio-v2/ca-navbar-logo.png" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#0A0A0A" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carl Anthony Eguizabal - Your Brand" />
    <meta property="og:url" content="https://carlanthonyeguizabal1504.github.io/portfolio-v2/" />
    <meta property="og:title" content="Carl Anthony Eguizabal | Student Portfolio" />
    <meta property="og:description" content="School projects and the learning journey of Carl Anthony Eguizabal, a second-year BSIT student." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carl Anthony Eguizabal, Your Role" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dark by default; a saved light pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F0F8FF')
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/portfolio-v2/assets/source-index-BynMWG2M.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio-v2/assets/source-index-CnVG3MON.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
